on:
  push:
  workflow_dispatch:

jobs:
  build_dev:
    uses: dan/workflow-templates/.forgejo/workflows/docker-image-build.yml@main
    with:
      runner: london
      image_location: .
      registry: git.epichouse.co.uk
      forgejo_url: ${{ github.server_url }}
      repository: ${{ github.repository }}
      owner: dan
      image_name: snippets
      image_tag: development
      no_cache: true
    secrets: inherit

  deploy_dev:
    needs: build_dev
    uses: dan/workflow-templates/.forgejo/workflows/docker-compose-deploy.yml@main
    with:
      runner: london
      server: ldnapptst1
      compose_project: snippets-test
      enabled: true
    secrets: inherit

  build_prod:
    needs: deploy_dev
    uses: dan/workflow-templates/.forgejo/workflows/docker-image-build.yml@main
    with:
      runner: london
      image_location: .
      registry: git.epichouse.co.uk
      forgejo_url: ${{ github.server_url }}
      repository: ${{ github.repository }}
      owner: dan
      image_name: snippets
      image_tag: latest
      no_cache: true
    secrets: inherit

  deploy_prod:
    needs: build_prod
    uses: dan/workflow-templates/.forgejo/workflows/docker-compose-deploy.yml@main
    with:
      runner: london
      server: ldnappprd1
      compose_project: snippets
      enabled: true
    secrets: inherit